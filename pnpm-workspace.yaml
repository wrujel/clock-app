# pnpm settings for this (single-package) repo. pnpm 11 reads its configuration
# from here rather than .npmrc; there is no `packages:` key, so this does not
# declare a workspace.

# Postinstall scripts are gated by default since pnpm 10. unrs-resolver builds
# the native binding eslint-import-resolver-typescript needs, so `pnpm lint`
# fails without it.
allowBuilds:
  unrs-resolver: true

# Cleared through the local minimum-release-age supply-chain gate.
minimumReleaseAgeExclude:
  - '@vitejs/plugin-react@6.1.1'

# eslint-config-next's plugin stack still declares eslint ^9 peers; the tree is
# verified to work, so warn rather than fail the install.
strictPeerDependencies: false
autoInstallPeers: true
